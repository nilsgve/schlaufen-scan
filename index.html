<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f9e">
<title>Schlaufen-Scan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #eef2f6; --card: #ffffff; --text: #14202e; --muted: #566579; --line: #d4dce5;
  --blue: #0b4f9e; --blue-soft: #dcebfb; --ok: #12703f; --ok-soft: #dcf3e6;
  --bad: #b3261e; --bad-soft: #fde7e5; --warn: #7a5200; --warn-soft: #fdf0d0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f151c; --card: #1a232e; --text: #edf2f7; --muted: #9dabbb; --line: #2e3b4a;
    --blue: #6db1f5; --blue-soft: #16324f; --ok: #62d596; --ok-soft: #123524;
    --bad: #ff8f86; --bad-soft: #43201e; --warn: #f2c65c; --warn-soft: #3a2e10;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 10px; min-height: 48px; padding: 0 16px; font-weight: 600; background: var(--blue-soft); color: var(--blue); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.primary { background: var(--blue); color: var(--card); }
.danger { background: var(--bad-soft); color: var(--bad); }
main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-size: 22px; margin: 0; }
#count { color: var(--muted); font-variant-numeric: tabular-nums; }
#scanCard { width: 100%; min-height: 128px; padding: 16px; display: grid; place-content: center; gap: 4px; text-align: center; border-radius: 14px; background: var(--card); color: var(--text); border: 2px solid var(--line); }
#scanCard strong { font-size: 20px; }
#scanCard span { color: var(--muted); font-weight: 400; font-size: 15px; }
#scanCard[data-state="scanning"] { border-color: var(--ok); background: var(--ok-soft); }
#scanCard[data-state="scanning"] strong { color: var(--ok); }
#scanCard[data-state="error"] { border-color: var(--bad); background: var(--bad-soft); }
#scanCard[data-state="error"] strong { color: var(--bad); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .wide { grid-column: 1 / -1; }
#search { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
#list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
#list:empty { display: none; }
#list button { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline; text-align: left; background: none; color: var(--text); border-radius: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#list li:last-child button { border-bottom: 0; }
.num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.uid { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.when { grid-column: 1 / -1; font-size: 12px; font-weight: 400; color: var(--muted); }
#empty { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
dialog { border: 0; padding: 16px; width: min(100%, 460px); max-width: 100%; margin: auto auto 0; border-radius: 18px 18px 0 0; background: var(--card); color: var(--text); }
dialog::backdrop { background: rgb(0 0 0 / .55); }
dialog h2 { margin: 0; font-size: 18px; }
#dUid { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; margin: 2px 0 10px; }
#cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
#cells div { height: 52px; display: grid; place-items: center; font-size: 26px; font-weight: 700; border: 2px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
#cells div.next { border-color: var(--blue); }
#msg { min-height: 40px; margin: 6px 0; padding: 4px 8px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; }
#msg.bad { background: var(--bad-soft); color: var(--bad); }
#msg.warn { background: var(--warn-soft); color: var(--warn); }
#pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#pad button { min-height: 54px; font-size: 24px; background: var(--bg); color: var(--text); }
.row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 8px; }
#dDelete { width: 100%; margin-top: 8px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; padding: 14px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
#toast.show { opacity: 1; }
#progress { background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.pTop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#pOpen { font-size: 24px; font-variant-numeric: tabular-nums; }
#pDone, #pNote { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
#pBar { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
#tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#tabs button { min-height: 44px; padding: 0 8px; font-size: 14px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
#tabs button[aria-selected="true"] { background: var(--blue); color: var(--card); border-color: var(--blue); }
#list li.device { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#list li.device:last-child { border-bottom: 0; }
.dev { grid-column: 1 / -1; font-size: 14px; font-weight: 500; }
.tag { justify-self: end; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); }
.cat { justify-self: end; font-size: 12px; font-weight: 400; color: var(--muted); text-align: right; }
#msg.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
#tabs button:last-child { grid-column: 1 / -1; }
#dUid { white-space: pre-line; }
.tag.wide { grid-column: 1 / -1; justify-self: start; }
#entry { max-height: 100dvh; overflow-y: auto; }
#dReplace, #dBroken { width: 100%; margin-top: 8px; }
#dReplace { background: var(--warn-soft); color: var(--warn); }
#update { max-height: 88dvh; overflow-y: auto; }
#uList { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
#uList li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; background: var(--bg); font-size: 14px; }
#uList strong { font-variant-numeric: tabular-nums; }
#uWarn { padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }
#uConflicts { display: grid; gap: 8px; margin-bottom: 8px; }
#uConflicts fieldset { margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
#uConflicts legend { font-weight: 700; padding: 0 4px; }
#uConflicts label { display: flex; align-items: center; gap: 8px; min-height: 40px; overflow-wrap: anywhere; font-size: 13px; }
#uConflicts input { width: 20px; height: 20px; flex: none; }
.uBlocked { font-size: 13px; color: var(--bad); background: var(--bad-soft); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><h1>Schlaufen-Scan</h1><div id="count" aria-live="polite"></div></header>

  <section id="progress" aria-label="Fortschritt" hidden>
    <div class="pTop"><strong id="pOpen"></strong><span id="pDone"></span></div>
    <div class="bar" id="pTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="pBar"></span></div>
    <div id="pNote"></div>
  </section>

  <button id="scanCard" data-state="idle">
    <strong id="scanTitle">Scan starten</strong>
    <span id="scanText">Antippen und NFC-Zugriff erlauben</span>
  </button>
  <button id="demoScan" hidden>Test-Scan auslösen</button>

  <div class="actions">
    <button id="xlsxBtn" class="primary" hidden>Excel mit NFC speichern</button>
    <button id="xlsxShareBtn" class="primary" hidden>Excel teilen</button>
    <button id="exportBtn">CSV speichern</button>
    <button id="shareBtn">CSV teilen</button>
    <button id="importBtn" class="wide">CSV wiederherstellen</button>
    <button id="fosterBtn" class="wide">Werkzeugliste laden</button>
    <input id="importFile" type="file" accept=".csv,text/csv,text/plain" hidden>
    <input id="fosterFile" type="file" accept=".xlsx,.xls,.csv,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
  </div>

  <div id="tabs" role="tablist" hidden>
    <button role="tab" data-tab="open"></button>
    <button role="tab" data-tab="done"></button>
    <button role="tab" data-tab="unknown"></button>
    <button role="tab" data-tab="nonum"></button>
    <button role="tab" data-tab="archive"></button>
  </div>
  <input id="search" type="search" placeholder="Nummer, Gerät, Kategorie, Ort suchen" aria-label="Nummer, Gerät, Kategorie oder Ort suchen">
  <ul id="list"></ul>
  <p id="empty"></p>
</main>

<dialog id="entry" aria-labelledby="dTitle">
  <h2 id="dTitle"></h2>
  <div id="dUid"></div>
  <div id="cells" aria-live="polite"></div>
  <div id="msg" role="status"></div>
  <div id="pad"></div>
  <div class="row">
    <button id="dCancel">Abbrechen</button>
    <button id="dSave" class="primary">Speichern</button>
  </div>
  <button id="dReplace" hidden>Chip ersetzen</button>
  <button id="dBroken" hidden></button>
  <button id="dDelete" class="danger" hidden>Eintrag löschen</button>
</dialog>

<dialog id="update" aria-labelledby="uTitle">
  <h2 id="uTitle">Werkzeugliste aktualisieren</h2>
  <ul id="uList"></ul>
  <div id="uWarn" hidden></div>
  <div id="uConflicts"></div>
  <div class="row">
    <button id="uCancel">Abbrechen</button>
    <button id="uApply" class="primary">Übernehmen</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
(() => {
  const demo = new URLSearchParams(location.search).get('demo') === '1';
  const KEY = demo ? 'nfc-schlaufen.demo' : 'nfc-schlaufen.v1';
  const $ = id => document.getElementById(id);
  const FOSTER_KEY = demo ? 'nfc-schlaufen.foster.demo' : 'nfc-schlaufen.foster.v1';
  let records = load();
  let devices = loadFoster();
  let byNum = indexDevices();
  const CONFLICT_KEY = demo ? 'nfc-schlaufen.conflicts.demo' : 'nfc-schlaufen.conflicts.v1';
  let fileConflicts = loadConflicts();   // NFC-IDs aus der Datei, die keiner Nummer zugeordnet werden konnten
  let pendingUpdate = null;
  let tab = 'open';
  let current = null;       // { uid, digits, existing, confirmDelete, replace }
  let ignore = { uid: '', until: 0 };
  let scanning = false;
  let toastTimer;

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(records)); return true; }
    catch { toast('Speichern fehlgeschlagen. Bitte sofort CSV sichern.'); return false; }
  }
  function loadFoster() {
    try {
      const data = JSON.parse(localStorage.getItem(FOSTER_KEY) || '[]');
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function loadConflicts() {
    try {
      const data = JSON.parse(localStorage.getItem(CONFLICT_KEY) || '[]');
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  const isActive = r => !r.archived && !r.broken;
  function dropConflict(number) {
    if (!fileConflicts.some(c => c.number === number)) return;
    fileConflicts = fileConflicts.filter(c => c.number !== number);
    try { localStorage.setItem(CONFLICT_KEY, JSON.stringify(fileConflicts)); } catch {}
  }
  function indexDevices() {
    return new Map(devices.filter(d => /^\d{6}$/.test(d.id)).map(d => [d.id, d]));
  }
  function deviceName(d) {
    if (!d) return '';
    return d.m.toLowerCase().startsWith(d.h.toLowerCase()) ? d.m : [d.h, d.m].filter(Boolean).join(' ');
  }
  function parseCsv(t) {
    const rows = [];
    let row = [], f = '', q = false;
    const endRow = () => { row.push(f); f = ''; if (row.some(x => x.trim())) rows.push(row); row = []; };
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c !== '"') f += c;
        else if (t[i + 1] === '"') { f += '"'; i++; }
        else q = false;
      } else if (c === '"') q = true;
      else if (c === ';') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; endRow(); }
      else f += c;
    }
    endRow();
    return rows;
  }
  async function readText(file) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch { return new TextDecoder('windows-1252').decode(buf); }
  }
  async function unzip(buf) {
    const v = new DataView(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Excel-Datei ist beschädigt');
    const count = v.getUint16(e + 10, true);
    let p = v.getUint32(e + 16, true);
    const dec = new TextDecoder();
    const files = new Map();
    for (let i = 0; i < count; i++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error('Excel-Datei ist beschädigt');
      const nameLen = v.getUint16(p + 28, true);
      const name = dec.decode(new Uint8Array(buf, p + 46, nameLen)).replace(/\\/g, '/');
      files.set(name, { method: v.getUint16(p + 10, true), size: v.getUint32(p + 20, true), local: v.getUint32(p + 42, true) });
      p += 46 + nameLen + v.getUint16(p + 30, true) + v.getUint16(p + 32, true);
    }
    const bytes = async name => {
      const f = files.get(name);
      if (!f) return null;
      const start = f.local + 30 + v.getUint16(f.local + 26, true) + v.getUint16(f.local + 28, true);
      const data = new Uint8Array(buf, start, f.size);
      if (f.method === 0) return data;
      if (f.method !== 8) throw new Error('Excel-Datei wird nicht unterstützt');
      const out = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(out).arrayBuffer());
    };
    const read = async name => { const b = await bytes(name); return b && dec.decode(b); };
    read.bytes = bytes;
    read.names = [...files.keys()].filter(n => !n.endsWith('/'));
    return read;
  }
  const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    return c >>> 0;
  });
  function crc32(data) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function zipFiles(entries) {
    const enc = new TextEncoder();
    const now = new Date();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [], central = [];
    let offset = 0;
    for (const { name, data } of entries) {
      const nameBytes = enc.encode(name);
      const packed = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
      const crc = crc32(data);
      const common = h => {
        h.setUint16(0, 20, true); h.setUint16(2, 0x0800, true); h.setUint16(4, 8, true);
        h.setUint16(6, time, true); h.setUint16(8, date, true); h.setUint32(10, crc, true);
        h.setUint32(14, packed.length, true); h.setUint32(18, data.length, true); h.setUint16(22, nameBytes.length, true);
      };
      const local = new Uint8Array(30);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      common(new DataView(local.buffer, 4));
      const cen = new Uint8Array(46);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      common(new DataView(cen.buffer, 6));
      cv.setUint32(42, offset, true);
      parts.push(local, nameBytes, packed);
      central.push(cen, nameBytes);
      offset += local.length + nameBytes.length + packed.length;
    }
    const cenSize = central.reduce((n, b) => n + b.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cenSize, true);
    ev.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end], { type: XLSX_TYPE });
  }
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];
  const cellText = node => tags(node, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join('');
  function columnIndex(ref, fallback) {
    const m = /^[A-Z]+/.exec(ref || '');
    return m ? [...m[0]].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1 : fallback;
  }
  function sheetRows(doc, shared) {
    const rows = [];
    for (const rowEl of tags(doc, 'row')) {
      const row = [];
      for (const c of tags(rowEl, 'c')) row[columnIndex(c.getAttribute('r'), row.length)] = cellValue(c, shared);
      const filled = Array.from(row, x => x ?? '');
      if (filled.some(x => x.trim())) rows.push(filled);
    }
    return rows;
  }
  function cellValue(c, shared) {
    const type = c.getAttribute('t');
    const raw = tags(c, 'v')[0]?.textContent ?? '';
    if (type === 's') return shared[Number(raw)] ?? '';
    if (type === 'inlineStr') return cellText(c);
    if (type === 'e') return '';
    if (type === 'b') return raw === '1' ? 'Ja' : 'Nein';
    if (type !== 'str' && /e/i.test(raw) && Number.isFinite(Number(raw))) return Number(raw).toLocaleString('fullwide', { useGrouping: false });
    return raw;
  }
  async function openWorkbook(read) {
    const wb = await read('xl/workbook.xml');
    const rels = await read('xl/_rels/workbook.xml.rels');
    if (!wb || !rels) throw new Error('Das ist keine Excel-Tabelle');
    const targets = new Map(tags(xml(rels), 'Relationship').map(r => [r.getAttribute('Id'), r.getAttribute('Target')]));
    const sharedXml = await read('xl/sharedStrings.xml');
    const shared = sharedXml ? tags(xml(sharedXml), 'si').map(cellText) : [];
    const paths = tags(xml(wb), 'sheet').map(s => {
      const target = targets.get([...s.attributes].find(a => a.localName === 'id')?.value);
      return target && (target.startsWith('/') ? target.slice(1) : `xl/${target}`);
    }).filter(Boolean);
    return { sharedXml, shared, paths };
  }
  async function readXlsx(file) {
    const read = await unzip(await file.arrayBuffer());
    const { shared, paths } = await openWorkbook(read);
    let first = [];
    for (const [i, path] of paths.entries()) {
      const text = await read(path);
      if (!text) continue;
      const rows = sheetRows(xml(text), shared);
      if (i === 0) first = rows;
      if (rows.some(r => r.some(c => c.trim() === 'NFC/ID'))) return rows;
    }
    return first;
  }
  const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const NFC_COLUMN = 'NFC-Tag-ID';
  const SOURCE_KEY = demo ? 'nfc-schlaufen.source.demo' : 'nfc-schlaufen.source.v1';
  const columnName = i => { let s = ''; for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const lookupId = v => { const s = String(v ?? '').trim(); return /^\d{1,5}$/.test(s) ? s.padStart(6, '0') : s; };
  const xmlText = s => String(s ?? '').replace(/[^\t\n\r -퟿-�]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const serialize = doc => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(doc.documentElement);

  function saveSource(name, buf) {
    const b = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    localStorage.setItem(SOURCE_KEY, JSON.stringify({ name, data: btoa(bin) }));
  }
  function loadSource() {
    try {
      const s = JSON.parse(localStorage.getItem(SOURCE_KEY) || 'null');
      if (!s) return null;
      const bin = atob(s.data);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return { name: s.name, buf: buf.buffer };
    } catch { return null; }
  }
  async function patchXlsx(buf, uids) {
    const read = await unzip(buf);

  async function importFoster(file) {
    let table;
    try { table = (await readTable(file)).map(r => r.map(fixEncoding)); }
    catch (err) { return toast(err.message || 'Datei konnte nicht gelesen werden'); }
    const headAt = table.findIndex(r => r.some(c => c.trim() === 'NFC/ID'));
    if (headAt < 0) return toast('Das ist keine Foster-Werkzeugliste');
    const head = table[headAt].map(s => s.trim());
    const rows = table.slice(headAt + 1);
    const col = name => head.indexOf(name);
    const iId = col('NFC/ID');
    if (iId < 0 || col('Modell') < 0) return toast('Das ist keine Foster-Werkzeugliste');
    const get = (r, name) => (col(name) < 0 ? '' : (r[col(name)] || '').trim());
    const next = rows.map(r => {
      const raw = (r[iId] || '').trim();
      return {

        h: get(r, 'Hersteller'), m: get(r, 'Modell'), k: get(r, 'Kategorie'), s: get(r, 'Seriennummer'),

  function planUpdate(next, fileIds) {
    const newNums = new Set(next.filter(d => /^\d{6}$/.test(d.id)).map(d => d.id));

    const plan = {

      resolved: records.filter(r => !r.archived && !oldNums.has(r.number) && newNums.has(r.number)),

    const clash = records.find(r => r.number === current.digits && r.uid !== current.uid);
    if (clash) {
      buzz([30, 60, 30]);
      if (current.existing) return setMsg('bad', `Nummer ${clash.number} gehört schon zu ${clash.uid}.`);
      current.replace = clash;
      $('dReplace').hidden = false;
      return setMsg('bad', `Nummer ${clash.number} hat schon den Chip ${clash.uid}. Wurde der Chip getauscht?`);
    }
    const now = stamp();
    if (current.existing) {
      if (current.existing.number !== current.digits) { delete current.existing.archived; delete current.existing.dev; }
      current.existing.number = current.digits;
      current.existing.updatedAt = now;
    } else records.push({ uid: current.uid, number: current.digits, createdAt: now, updatedAt: now });
    dropConflict(current.digits);
    const saved = persist();
    const number = current.digits;
    closeEntry();
    render();
    if (saved) { buzz([40, 40, 40]); toast(`${number} gespeichert`); }
  }
  function replaceChip() {
    if (!current?.replace) return;
    const r = current.replace;
    const now = stamp();
    r.oldUids = [...(r.oldUids || []), { uid: r.uid, replacedAt: now }];
    r.uid = current.uid;
    r.updatedAt = now;
    delete r.broken;
    delete r.archived;
    delete r.dev;
    dropConflict(r.number);
    const saved = persist();
    closeEntry();
    render();
    if (saved) { buzz([40, 40, 40]); toast(`Chip von ${r.number} ersetzt`); }
  }
  function toggleBroken() {
    const r = current?.existing;
    if (!r) return;
    if (r.broken) delete r.broken;
    else r.broken = stamp();
    r.updatedAt = stamp();
    const nowBroken = !!r.broken;
    const saved = persist();
    closeEntry();
    render();
    if (saved) toast(nowBroken ? `${r.number}: Chip defekt, Gerät wieder offen` : `${r.number}: Markierung aufgehoben`);
  }
  function deleteEntry() {
    if (!current || !current.existing) return;
    if (!current.confirmDelete) {
      current.confirmDelete = true;
      $('dDelete').textContent = 'Wirklich löschen?';
      return;
    }
    records = records.filter(r => r.uid !== current.uid);
    persist();
    const number = current.existing.number;
    closeEntry();
    render();
    toast(`${number} gelöscht`);
  }

  function render() {
    const q = $('search').value.trim().toUpperCase();
    const hasList = byNum.size > 0;
    const scanned = new Set(records.filter(isActive).map(r => r.number));
    const brokenByNum = new Map(records.filter(r => r.broken && !r.archived).map(r => [r.number, r]));
    const open = [...byNum.values()].filter(d => !scanned.has(d.id));
    const unknown = records.filter(r => !r.archived && !byNum.has(r.number));
    const archived = records.filter(r => r.archived);
    const done = records.filter(r => isActive(r) && byNum.has(r.number));
    const noNumber = devices.filter(d => !/^\d{6}$/.test(d.id));
    const doneCount = byNum.size - open.length;
    const openDefect = open.filter(d => d.x).length;
    const openBroken = open.filter(d => brokenByNum.has(d.id)).length;

    $('count').textContent = `${records.filter(isActive).length} erfasst`;
    $('progress').hidden = !hasList;
    $('tabs').hidden = !hasList;
    $('fosterBtn').textContent = hasList ? 'Werkzeugliste aktualisieren' : 'Werkzeugliste laden';
    if (hasList) {
      const pct = Math.floor(doneCount / byNum.size * 100);
      $('pOpen').textContent = open.length ? `Noch ${open.length} offen` : 'Alle erfasst';
      $('pDone').textContent = `${doneCount} von ${byNum.size} (${pct} %)`;
      $('pBar').style.width = `${pct}%`;
      $('pTrack').setAttribute('aria-valuenow', pct);
      const notes = [];
      if (openDefect) notes.push(`Davon ${openDefect} Geräte defekt`);
      if (openBroken) notes.push(`${openBroken} mit defektem Chip`);
      if (fileConflicts.length) notes.push(`NFC-Konflikt bei ${fileConflicts.slice(0, 3).map(c => c.number).join(', ')}${fileConflicts.length > 3 ? ' …' : ''}`);
      $('pNote').textContent = notes.join(' · ');
      $('pNote').hidden = !notes.length;
      const labels = { open: `Offen (${open.length})`, done: `Erfasst (${done.length})`, unknown: `Nicht in Foster (${unknown.length})`, nonum: `Ohne Nummer (${noNumber.length})`, archive: `Archiv (${archived.length})` };
      for (const b of $('tabs').children) {
        b.textContent = labels[b.dataset.tab];
        b.setAttribute('aria-selected', String(b.dataset.tab === tab));
      }
    }

    const hay = (...v) => v.join(' ').toUpperCase();
    const devHay = d => hay(d.id, d.h, d.m, d.k, d.s, d.b);
    const recHay = r => {
      const d = byNum.get(r.number) || r.dev;
      const old = (r.oldUids || []).map(o => `${o.uid} ${o.uid.replace(/:/g, '')}`).join(' ');
      return hay(r.number, r.uid, r.uid.replace(/:/g, ''), old, d ? hay(d.h, d.m, d.k, d.s, d.b || '') : '');
    };
    const byCategory = (a, b) => a.k.localeCompare(b.k, 'de') || deviceName(a).localeCompare(deviceName(b), 'de');
    const newest = (a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '');
    let items;
    if (hasList && (tab === 'open' || tab === 'nonum')) {
      items = (tab === 'open' ? open : noNumber).filter(d => !q || devHay(d).includes(q)).sort(byCategory)
        .map(d => brokenByNum.has(d.id) ? recordRow(brokenByNum.get(d.id)) : deviceRow(d));
    } else {
      const base = !hasList ? records : tab === 'unknown' ? unknown : tab === 'archive' ? archived : done;
      items = base.filter(r => !q || recHay(r).includes(q)).sort(newest).map(r => recordRow(r));
    }
    $('list').replaceChildren(...items);
    const emptyText = q ? 'Kein Treffer'
      : !hasList ? 'Noch keine Schlaufen erfasst'
      : tab === 'open' ? 'Alle Geräte mit Nummer sind erfasst'
      : tab === 'unknown' ? 'Keine Abweichungen zur Werkzeugliste'
      : tab === 'nonum' ? 'Alle Geräte haben eine Nummer'
      : tab === 'archive' ? 'Archiv ist leer' : 'Noch keine Schlaufen erfasst';
    $('empty').textContent = items.length ? '' : emptyText;
    $('empty').hidden = !!items.length;
    for (const id of ['exportBtn', 'shareBtn']) $(id).disabled = !records.length;
    for (const id of ['xlsxBtn', 'xlsxShareBtn']) { $(id).hidden = !hasList; $(id).disabled = !records.length; }
  }
  const span = (className, textContent) => Object.assign(document.createElement('span'), { className, textContent });
  function recordRow(r) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.append(span('num', r.number), span('uid', r.uid));
    const label = r.archived ? 'Archiviert' : r.broken ? 'Chip defekt' : r.oldUids?.length ? 'Chip getauscht' : '';
    if (label) b.append(span('tag wide', label));
    const dev = byNum.get(r.number) || r.dev;
    if (dev) b.append(span('dev', deviceName(dev)));
    b.append(span('when', germanDate(r.archived || r.updatedAt)));
    b.onclick = () => openEntry(r.uid);
    li.append(b);
    return li;
  }
  function deviceRow(d) {
    const li = document.createElement('li');
    li.className = 'device';
    li.append(span('num', d.id), d.x ? span('tag', 'Defekt') : span('cat', d.k), span('dev', deviceName(d)));
    if (d.b) li.append(span('when', d.b));
    return li;
  }

  function csvBlob() {
    const esc = v => {
      let s = String(v ?? '');
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = ['Nummer;NFC-ID;NFC-ID ohne Trennzeichen;Erfasst am;Geändert am;In Foster;Hersteller;Modell;Kategorie;Seriennummer;Status;Alte NFC-IDs'];
    [...records].sort((a, b) => a.number.localeCompare(b.number)).forEach(r => {
      const inList = byNum.get(r.number);
      const d = inList || r.dev;
      const status = r.archived ? 'Archiviert' : r.broken ? 'Chip defekt' : 'Aktiv';
      const old = (r.oldUids || []).map(o => `${o.uid}@${o.replacedAt}`).join('|');
      lines.push([r.number, r.uid, r.uid.replace(/:/g, ''), r.createdAt, r.updatedAt,
        byNum.size ? (inList ? 'Ja' : 'Nein') : '', d?.h, d?.m, d?.k, d?.s, status, old].map(esc).join(';'));
    });
    return new Blob(['\uFEFF' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
  }
  const csvName = () => `nfc-schlaufen_${stamp().slice(0, 10)}.csv`;
  function exportCsv() {
    const url = URL.createObjectURL(csvBlob());
    const a = Object.assign(document.createElement('a'), { href: url, download: csvName() });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('CSV gespeichert');
  }
  async function shareCsv() {
    const file = new File([csvBlob()], csvName(), { type: 'text/csv' });
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) return exportCsv();
    try { await navigator.share({ files: [file], title: file.name }); }
    catch (err) { if (err.name !== 'AbortError') exportCsv(); }
  }
  async function importCsv(file) {
    const text = (await readText(file)).replace(/^\uFEFF/, '');
    const rows = parseCsv(text).map(r => r.map(fixEncoding));
    const head = (rows.shift() || []).map(s => s.trim());
    const iNum = head.indexOf('Nummer'), iUid = head.indexOf('NFC-ID');
    const iNew = head.indexOf('Erfasst am'), iUpd = head.indexOf('Geändert am');
    if (iNum < 0 || iUid < 0) return toast('Datei passt nicht: Spalten fehlen');
    let added = 0, skipped = 0;
    for (const row of rows) {
      const c = row.map(s => s.trim());
      const number = /^\d{1,5}$/.test(c[iNum] || '') ? c[iNum].padStart(6, '0') : c[iNum];
      const uid = normalizeUid(c[iUid]);
      if (!/^\d{6}$/.test(number) || !uid || records.some(r => r.uid === uid || r.number === number || r.oldUids?.some(o => o.uid === uid))) { skipped++; continue; }
      const now = stamp();
      const rec = { uid, number, createdAt: c[iNew] || now, updatedAt: c[iUpd] || c[iNew] || now };
      const status = c[head.indexOf('Status')];
      if (status === 'Chip defekt') rec.broken = rec.updatedAt;
      if (status === 'Archiviert') {
        rec.archived = rec.updatedAt;
        const part = name => c[head.indexOf(name)] || '';
        rec.dev = { h: part('Hersteller'), m: part('Modell'), k: part('Kategorie'), s: part('Seriennummer') };
      }
      const old = (c[head.indexOf('Alte NFC-IDs')] || '').split('|').map(s => {
        const [oldUid, replacedAt] = s.split('@');
        return { uid: normalizeUid(oldUid), replacedAt: replacedAt || '' };
      }).filter(o => o.uid);
      if (old.length) rec.oldUids = old;
      records.push(rec);
      added++;
    }
    persist();
    render();
    toast(`${added} ergänzt, ${skipped} übersprungen`);
  }

  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'del'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'del' ? '⌫' : k === 'clear' ? 'C' : k;
    if (k === 'del') b.setAttribute('aria-label', 'Letzte Ziffer löschen');
    if (k === 'clear') b.setAttribute('aria-label', 'Eingabe leeren');
    b.onclick = () => press(k);
    $('pad').append(b);
  });
  $('scanCard').onclick = startScan;
  $('dSave').onclick = saveEntry;
  $('dCancel').onclick = closeEntry;
  $('dDelete').onclick = deleteEntry;
  $('dReplace').onclick = replaceChip;
  $('dBroken').onclick = toggleBroken;
  $('uApply').onclick = applyUpdate;
  $('uCancel').onclick = cancelUpdate;
  $('update').addEventListener('cancel', e => { e.preventDefault(); cancelUpdate(); });
  $('entry').addEventListener('cancel', e => { e.preventDefault(); closeEntry(); });
  $('entry').addEventListener('keydown', e => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') { e.preventDefault(); saveEntry(); }
  });
  $('search').oninput = render;
  $('exportBtn').onclick = exportCsv;
  $('shareBtn').onclick = shareCsv;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) await importCsv(f);
  };

  $('xlsxBtn').onclick = () => exportExcel(false);
  $('xlsxShareBtn').onclick = () => exportExcel(true);
  $('fosterBtn').onclick = () => $('fosterFile').click();
  $('fosterFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) await importFoster(f);
  };
  $('tabs').onclick = e => {
    const b = e.target.closest('button');
    if (b) { tab = b.dataset.tab; render(); }
  };

  if (demo) {
    $('demoScan').hidden = false;
    $('demoScan').onclick = () => onTag('04:' + Array.from({ length: 6 }, () => pad2(Math.floor(Math.random() * 256).toString(16))).join(':'));
    window.__scan = onTag;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && !demo) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.permissions && 'NDEFReader' in window) {
    navigator.permissions.query({ name: 'nfc' }).then(p => { if (p.state === 'granted') startScan(); }).catch(() => {});
  }
  render();
})();
</script>
</body>
</html>
